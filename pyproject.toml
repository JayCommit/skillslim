[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillslim"
version = "0.0.2"
description = "Small skill entrypoints, on-demand guidance, and a progressive-disclosure linter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
skillslim = "skillslim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillslim = ["template/*.md", "template/references/*.md", "template/examples/*.md"]
